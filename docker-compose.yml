# Base stack — used as-is for LOCAL DEVELOPMENT (frontend/backend published on
# the host; no TLS). For PRODUCTION, layer the nginx + certbot + hardening
# overlay on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# (or set COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env so the
# plain `docker compose ...` commands pick up both — see DEPLOYMENT.md).
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      # CORS allowlist. This base file is used for local dev (frontend on
      # localhost:3000); the prod overlay overrides it to https://${DOMAIN}.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # SMTP result emails. Email is disabled while SMTP_HOST is empty (sends are
      # skipped/logged); submission is never affected. Port/From carry non-empty
      # defaults so an unset value doesn't break a configured transport.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@sparta.local}
      # OpenAI (AI disabled while OPENAI_API_KEY is empty). Backend-only.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Midtrans token payments (unset -> demo credit fallback).
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      TOKEN_PRICE_IDR: ${TOKEN_PRICE_IDR:-1000}
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined at BUILD time by Next.js, so the API base URL
        # must be a build arg (not just a runtime env var). Defaults to the
        # local dev API; the prod overlay overrides it to https://${DOMAIN}.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
