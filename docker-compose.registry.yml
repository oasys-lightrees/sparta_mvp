# CI/CD deploy overlay — run PREBUILT images from GHCR instead of building on
# the server. Layer it AFTER the base + prod files:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml \
#                  -f docker-compose.registry.yml pull && ... up -d
#
# REGISTRY (e.g. ghcr.io/oasys-lightrees) and IMAGE_TAG (the commit SHA) are
# provided by scripts/deploy.sh. This overlay only overrides the two app images
# and adds container healthchecks so `docker compose up -d --wait` blocks until
# they report healthy. nginx/certbot/database are unchanged (public images).
services:
  backend:
    image: ${REGISTRY}/lato-backend:${IMAGE_TAG:-latest}
    # `build:` from the base file is ignored once an image is set + we only pull.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    image: ${REGISTRY}/lato-frontend:${IMAGE_TAG:-latest}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
