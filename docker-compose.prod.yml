# Production overlay — layers TLS (nginx + certbot) on top of docker-compose.yml
# and hardens exposure. Use it together with the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env so the
# plain `docker compose ...` commands (and scripts/init-letsencrypt.sh) apply
# both automatically. See DEPLOYMENT.md.
#
# Requires DOMAIN and CERTBOT_EMAIL in .env. First-time cert issuance is done by
# scripts/init-letsencrypt.sh (run it once instead of a bare `up`).
services:
  database:
    # Localhost-only: reachable for host-side drizzle tooling, never public.
    # !override replaces the base list (otherwise compose appends and the
    # public 0.0.0.0:5433 binding would remain).
    ports: !override
      - "127.0.0.1:5433:5432"

  backend:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Non-empty defaults: the backend reads these with `?? default`, so an empty
      # string here would override (break) the built-in default.
      SMTP_FROM: ${SMTP_FROM:-no-reply@${DOMAIN}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Midtrans token payments (unset -> demo credit fallback).
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      TOKEN_PRICE_IDR: ${TOKEN_PRICE_IDR:-1000}
    # Not published to the host — reached only through nginx at /api/.
    ports: !reset []

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin API base via nginx. Rebuild the image if you change this.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN}}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${DOMAIN}}
    # Not published to the host — reached only through nginx.
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Substituted into the rendered config by the command's envsubst step below.
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Render the template ourselves, then start nginx. The image's built-in
    # envsubst step only runs when the container command is `nginx ...`; since we
    # override the command (for the 6h reload loop that picks up renewed certs),
    # we must substitute ${DOMAIN} explicitly or nginx sees an unknown variable.
    # `$$DOMAIN` -> literal `$DOMAIN` for envsubst (compose collapses `$$`->`$`),
    # so only DOMAIN is replaced and nginx's own $host/$scheme are preserved.
    command: >-
      /bin/sh -c "envsubst '$$DOMAIN'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && { while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'; }"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Attempt renewal twice a day (no-op until within 30 days of expiry). First
    # issuance is handled by scripts/init-letsencrypt.sh.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  certbot_www:
  letsencrypt:
