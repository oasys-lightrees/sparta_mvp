# LATO — nginx reverse proxy
#
# Routes:
#   /api/*  -> backend  (Hono.js, port 3001)
#   /*      -> frontend (Next.js, port 3000; serves pages + /_next assets)
#
# Usage (Docker Compose): mount this file at /etc/nginx/conf.d/default.conf in
# an `nginx` service that shares the network with the `frontend` and `backend`
# services (upstream hostnames below are the compose service names).
#
# Usage (single host, no Docker): change the upstream `server` lines to
#   server 127.0.0.1:3000;   and   server 127.0.0.1:3001;

upstream lato_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream lato_backend {
    server backend:3001;
    keepalive 32;
}

# Redirect HTTP -> HTTPS (enable once TLS is configured in the 443 block below).
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Reasonable upload ceiling for JSON APIs.
    client_max_body_size 10m;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/plain;

    # Baseline security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_connect_timeout 30s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # --- API -> backend (the /api prefix is preserved) ---
    location /api/ {
        proxy_pass http://lato_backend;
    }

    # --- Everything else -> frontend (pages, /_next static assets, etc.) ---
    location / {
        proxy_pass http://lato_frontend;
    }
}

